<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>agent学习</title>
<meta http-equiv="refresh" content="0; url=./guide/">
<link rel="canonical" href="./guide/">
<style>
  :root {
    color-scheme: light;
    --bg: #f4efe6;
    --card: #fffaf3;
    --text: #2c241d;
    --muted: #6f6257;
    --accent: #b85c38;
    --border: rgba(120, 95, 68, 0.18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(circle at top right, rgba(184,92,56,0.12), transparent 24%),
      linear-gradient(180deg, rgba(255,250,242,0.8) 0%, rgba(244,239,230,0.96) 100%),
      var(--bg);
    color: var(--text);
    font-family: "Charter", "Iowan Old Style", "Palatino Linotype", "Noto Serif SC", "Source Han Serif SC", serif;
  }
  main {
    max-width: 640px;
    padding: 28px 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 16px 40px rgba(82, 58, 34, 0.08);
    text-align: center;
  }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(1.8rem, 4vw, 2.4rem);
  }
  p {
    margin: 0 0 14px;
    line-height: 1.75;
    color: var(--muted);
  }
  a {
    color: var(--accent);
    font-weight: 700;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<main>
  <h1>agent学习</h1>
  <p>页面正在跳转到学习主页。</p>
  <p>如果没有自动跳转，请点击 <a href="./guide/">进入 guide</a>。</p>
</main>
</body>
</html>
